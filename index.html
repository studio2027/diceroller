<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎲 Generator rzutów kośćmi – edytor puli kości</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="paintCursorIndicator"></div>

<div class="dice-container" id="mainContainer">

  <div class="editor-toggle-row">
    <button class="editor-toggle-btn" id="editorToggleBtn">⚙️ edytor kości</button>
  </div>

  <div class="dice-editor-panel" id="diceEditorPanel">
    <div class="editor-section-title">
      <span>🛠️ kreator (kliknij, aby dodać do podręcznej puli)</span>
      <span class="editor-add-range">
        <label>kość od-do:</label>
        <input type="number" id="rangeMin" value="0" />
        <label>-</label>
        <input type="number" id="rangeMax" value="9" />
        <button id="addRangeDiceBtn">+ dodaj</button>
      </span>
    </div>
    <div class="dice-grid" id="creatorDiceGrid"></div>

    <div class="editor-divider"></div>

    <div class="editor-section-title">📦 twoja podręczna pula (kliknij, aby usunąć z paska)</div>
    <div class="dice-grid editor-pool" id="editorPoolGrid"></div>
  </div>

  <div class="dice-grid" id="diceGrid"></div>

  <div class="panels-toolbar">
    <div class="color-palette-wrapper">
      <button class="toolbar-btn" id="paletteBtn">🎨 maluj</button>
      <div class="color-palette-popover" id="palettePopover">
        <div class="color-grid" id="colorGrid"></div>
      </div>
    </div>
    <button class="toolbar-btn" id="addPanelBtn">➕ dodaj tackę</button>
  </div>

  <div class="panels-row" id="panelsContainer"></div>

  <div class="footer-note">⬡ kliknij "edytor kości" aby dostosować pulę | wybierz kolor z palety, aby pomalować kość</div>
</div>

<script src="js/words.js"></script>
<script src="js/dice-svg.js"></script>
<script src="js/dice-registry.js"></script>
<script src="js/palette.js"></script>
<script src="js/pool.js"></script>
<script src="js/panels.js"></script>
<script src="js/main.js"></script>
</body>
</html>
